version: '3.8'

services:
  web-dashboard:
    build: .
    container_name: driver-allocation-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    depends_on:
      - mysql-db

  api-gateway:
    build: .
    container_name: driver-allocation-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      - mysql-db

  go-simulator:
    build: .
    container_name: driver-allocation-go-engine
    command: /app/bin/simulator --iterations 100000 --workers 8
    restart: "no"

  mysql-db:
    image: mysql:8.0
    container_name: driver-allocation-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
      MYSQL_DATABASE: "simulator"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
